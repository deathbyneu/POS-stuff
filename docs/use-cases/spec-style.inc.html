<meta charset="utf-8">
<style>
  @page { size: A4; margin: 1.8cm; }
  body { font-family: Arial, "DejaVu Sans", sans-serif; font-size: 10.5pt; line-height: 1.35; color: #172033; }
  h1 { color: #173c78; font-size: 24pt; margin: 0 0 18pt; }
  h2 { color: #1d4f91; font-size: 17pt; margin: 20pt 0 9pt; page-break-after: avoid; }
  h3 { color: #1e3a5f; font-size: 13pt; margin: 16pt 0 7pt; page-break-after: avoid; border-bottom: 1px solid #bfdbfe; padding-bottom: 3pt; }
  table { width: 100%; border-collapse: collapse; margin: 5pt 0 13pt; page-break-inside: avoid; }
  th, td { border: 1px solid #9eb4d0; padding: 6pt 7pt; vertical-align: top; }
  th { background: #eaf2ff; color: #173c78; font-weight: 700; }
