  <rect x="310" y="985" width="1080" height="45" rx="7" class="note"/><text x="330" y="1013" class="noteText"><tspan font-weight="700">Phạm vi:</tspan> EasyRetail quản lý bán hàng, nhập hàng và tồn kho tại quầy. Quản trị viên kế thừa toàn bộ quyền nhân viên.</text>
