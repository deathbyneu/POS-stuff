  <defs><style>.title{font:700 34px Arial,sans-serif}.sub{font:17px Arial,sans-serif}.boundary,.uc,.note{fill:#fff;stroke:#000}.boundary{stroke-width:3}.uc{stroke-width:2}.sys{font:700 19px Arial,sans-serif}.actor{fill:none;stroke:#000;stroke-width:3}.name{font:700 16px Arial,sans-serif;text-anchor:middle}.uct{font:700 14px Arial,sans-serif;text-anchor:middle}.assoc{fill:none;stroke:#000;stroke-width:1.7}.inherit{fill:none;stroke:#000;stroke-width:2;marker-end:url(#tri)}.label{font:italic 12px Arial,sans-serif}.noteText{font:13px Arial,sans-serif}</style><marker id="tri" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11 Z" fill="#fff" stroke="#000" stroke-width="1.5"/></marker></defs>
