  <g><ellipse cx="545" cy="228" rx="180" ry="38" class="uc"/><text x="545" y="234" class="uct">UC01 — Đăng nhập / đăng xuất</text><ellipse cx="545" cy="343" rx="180" ry="38" class="uc"/><text x="545" y="338" class="uct"><tspan x="545">UC02 — Bán hàng tại quầy</tspan><tspan x="545" dy="18">tiền mặt hoặc QR</tspan></text><ellipse cx="545" cy="458" rx="180" ry="38" class="uc"/><text x="545" y="464" class="uct">UC03 — Tra cứu đơn hàng</text><ellipse cx="545" cy="573" rx="180" ry="38" class="uc"/><text x="545" y="579" class="uct">UC04 — Quản lý khách hàng</text><ellipse cx="545" cy="688" rx="180" ry="38" class="uc"/><text x="545" y="683" class="uct"><tspan x="545">UC05 — Xem tồn kho, lô</tspan><tspan x="545" dy="18">và lịch sử biến động</tspan></text><ellipse cx="545" cy="803" rx="180" ry="38" class="uc"/><text x="545" y="798" class="uct"><tspan x="545">UC06 — Xem dashboard,</tspan><tspan x="545" dy="18">doanh thu và cảnh báo</tspan></text><ellipse cx="545" cy="918" rx="180" ry="38" class="uc"/><text x="545" y="924" class="uct">UC07 — Hỏi cố vấn kinh doanh AI</text></g>
