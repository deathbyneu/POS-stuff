<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><defs><style>.title{font:700 34px Arial,sans-serif}.boundary,.uc{fill:#fff;stroke:#000}.boundary{stroke-width:3}.uc{stroke-width:2}.dash{stroke-dasharray:7 5}.sys{font:700 19px Arial,sans-serif}.actor{fill:none;stroke:#000;stroke-width:3}.name{font:700 16px Arial,sans-serif;text-anchor:middle}.uct{font:700 14px Arial,sans-serif;text-anchor:middle}.sub{font:13px Arial,sans-serif;text-anchor:middle}.assoc{fill:none;stroke:#000;stroke-width:1.7}.rel{fill:none;stroke:#000;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#arr)}.inherit{fill:none;stroke:#000;stroke-width:2;marker-end:url(#tri)}.lbl{font:italic 12px Arial,sans-serif}</style><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#000" stroke-width="1.5"/></marker><marker id="tri" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11 Z" fill="#fff" stroke="#000" stroke-width="1.5"/></marker></defs><rect width="1800" height="1200" fill="#fff"/><text x="900" y="52" text-anchor="middle" class="title">BIỂU ĐỒ USE CASE PHÂN RÃ — QUẢN TRỊ VIÊN</text><rect x="260" y="100" width="1280" height="1030" rx="17" class="boundary"/><text x="290" y="138" class="sys">EASYRETAIL — CHỨC NĂNG QUẢN TRỊ</text>
