<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs><style>.title{font:700 34px Arial,sans-serif}.sub{font:17px Arial,sans-serif}.boundary,.uc{fill:#fff;stroke:#000}.boundary{stroke-width:3}.uc{stroke-width:2.2}.main{stroke-width:3}.dash{stroke-dasharray:7 5}.sys{font:700 19px Arial,sans-serif}.actor{fill:none;stroke:#000;stroke-width:3}.name{font:700 16px Arial,sans-serif;text-anchor:middle}.uct{font:14px Arial,sans-serif;text-anchor:middle}.bold{font-weight:700}.assoc{fill:none;stroke:#000;stroke-width:1.8}.rel{fill:none;stroke:#000;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#arrow)}.label{font:italic 12px Arial,sans-serif}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#000" stroke-width="1.5"/></marker></defs>
  <rect width="1800" height="1200" fill="#fff"/><text x="900" y="52" text-anchor="middle" class="title">UC02 — BÁN HÀNG TẠI QUẦY</text><text x="900" y="84" text-anchor="middle" class="sub">Thanh toán tiền mặt hoặc QR – Hệ thống EasyRetail</text>
  <rect x="260" y="120" width="1240" height="990" rx="17" class="boundary"/><text x="290" y="158" class="sys">EASYRETAIL — QUẦY BÁN HÀNG</text>
  <path d="M145 510 L665 225 M145 510 L345 722 M1645 810 L1450 882" class="assoc"/>
  <g transform="translate(95 430)" class="actor"><circle cx="50" cy="25" r="23"/><path d="M50 48 V112 M12 74 H88 M50 112 L16 157 M50 112 L84 157"/></g><text x="145" y="620" class="name"><tspan x="145">Nhân viên</tspan><tspan x="145" dy="21">bán hàng</tspan></text>
  <g transform="translate(1595 735)" class="actor"><circle cx="50" cy="25" r="22"/><path d="M50 47 V103 M15 70 H85 M50 103 L22 143 M50 103 L78 143"/></g><text x="1645" y="905" class="name"><tspan x="1645">Dịch vụ</tspan><tspan x="1645" dy="20">payOS</tspan></text>
  <ellipse cx="900" cy="225" rx="235" ry="50" class="uc main"/><text x="900" y="220" class="uct"><tspan x="900" class="bold">UC02 — Bán hàng tại quầy</tspan><tspan x="900" dy="19" class="bold">tiền mặt hoặc QR</tspan></text>
  <ellipse cx="525" cy="392" rx="180" ry="43" class="uc"/><text x="525" y="398" class="uct bold">Quét mã / tìm và chọn sản phẩm</text>
  <ellipse cx="525" cy="557" rx="180" ry="43" class="uc"/><text x="525" y="552" class="uct"><tspan x="525" class="bold">Quản lý giỏ hàng</tspan><tspan x="525" dy="18" font-size="12">Thêm, giảm, xóa và tính tạm tính</tspan></text>
  <ellipse cx="525" cy="722" rx="180" ry="43" class="uc dash"/><text x="525" y="717" class="uct"><tspan x="525" class="bold">Gắn khách hàng vào đơn</tspan><tspan x="525" dy="18" font-size="12">Tùy chọn để tích điểm</tspan></text>
  <ellipse cx="1240" cy="392" rx="195" ry="43" class="uc"/><text x="1240" y="387" class="uct"><tspan x="1240" class="bold">Kiểm tra giá và tồn tại máy chủ</tspan><tspan x="1240" dy="18" font-size="12">Không tin tổng tiền từ trình duyệt</tspan></text>
  <ellipse cx="1240" cy="557" rx="195" ry="43" class="uc"/><text x="1240" y="552" class="uct"><tspan x="1240" class="bold">Tạo đơn và xuất kho theo FEFO</tspan><tspan x="1240" dy="18" font-size="12">Lưu phân bổ theo đúng lô hàng</tspan></text>
  <ellipse cx="1240" cy="722" rx="195" ry="43" class="uc"/><text x="1240" y="728" class="uct bold">Chọn phương thức thanh toán</text>
  <ellipse cx="865" cy="882" rx="180" ry="43" class="uc"/><text x="865" y="877" class="uct"><tspan x="865" class="bold">Ghi nhận thanh toán tiền mặt</tspan><tspan x="865" dy="18" font-size="12">Hoàn tất đơn ngay tại quầy</tspan></text>
  <ellipse cx="1270" cy="882" rx="180" ry="43" class="uc"/><text x="1270" y="877" class="uct"><tspan x="1270" class="bold">Tạo và theo dõi thanh toán QR</tspan><tspan x="1270" dy="18" font-size="12">Chờ payOS xác nhận đúng số tiền</tspan></text>
  <ellipse cx="865" cy="1012" rx="180" ry="38" class="uc"/><text x="865" y="1018" class="uct bold">Hiển thị / in biên nhận</text>
  <ellipse cx="495" cy="942" rx="165" ry="38" class="uc dash"/><text x="495" y="937" class="uct"><tspan x="495" class="bold">Thông báo không đủ tồn /</tspan><tspan x="495" dy="18">sản phẩm đã ngừng bán</tspan></text>
  <ellipse cx="1270" cy="1012" rx="180" ry="38" class="uc dash"/><text x="1270" y="1007" class="uct"><tspan x="1270" class="bold">Hủy hoặc hết hạn QR</tspan><tspan x="1270" dy="18" font-size="12">Hoàn lại tồn đã giữ</tspan></text>
