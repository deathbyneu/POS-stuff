  <path d="M920 275 L1045 355" class="rel"/><text x="965" y="325" class="label">&lt;&lt;extend&gt;&gt; [chọn đơn]</text><path d="M890 278 L1060 515" class="rel"/><text x="970" y="470" class="label">&lt;&lt;extend&gt;&gt; [xuất CSV]</text><path d="M1110 664 V440" class="rel"/><text x="1120" y="640" class="label">&lt;&lt;extend&gt;&gt; [chọn hoàn đơn]</text>
