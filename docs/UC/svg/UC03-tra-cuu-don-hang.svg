<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs><style>.title{font:700 32px Arial,sans-serif}.sub{font:16px Arial,sans-serif}.boundary,.uc{fill:#fff;stroke:#000}.boundary{stroke-width:3}.uc{stroke-width:2.2}.main{stroke-width:3}.dash{stroke-dasharray:7 5}.sys{font:700 18px Arial,sans-serif}.actor{fill:none;stroke:#000;stroke-width:3}.name{font:700 16px Arial,sans-serif;text-anchor:middle}.uct{font:14px Arial,sans-serif;text-anchor:middle}.bold{font-weight:700}.assoc{fill:none;stroke:#000;stroke-width:1.8}.rel{fill:none;stroke:#000;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#arrow)}.inherit{fill:none;stroke:#000;stroke-width:2;marker-end:url(#tri)}.label{font:italic 12px Arial,sans-serif}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#000" stroke-width="1.5"/></marker><marker id="tri" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11 Z" fill="#fff" stroke="#000" stroke-width="1.5"/></marker></defs>
  <rect width="1600" height="1000" fill="#fff"/><text x="800" y="50" text-anchor="middle" class="title">UC03 — TRA CỨU ĐƠN HÀNG</text><text x="800" y="80" text-anchor="middle" class="sub">Use case chi tiết – Hệ thống quản lý bán hàng EasyRetail</text>
  <rect x="250" y="120" width="1100" height="780" rx="16" class="boundary"/><text x="280" y="158" class="sys">EASYRETAIL — QUẢN LÝ ĐƠN HÀNG</text>
  <path d="M145 395 L580 230 M145 755 L920 707" class="assoc"/><path d="M145 675 V475" class="inherit"/><text x="155" y="585" class="label">kế thừa quyền</text>
  <g transform="translate(95 315)" class="actor"><circle cx="50" cy="25" r="23"/><path d="M50 48 V112 M12 74 H88 M50 112 L16 157 M50 112 L84 157"/></g><text x="145" y="505" class="name"><tspan x="145">Nhân viên</tspan><tspan x="145" dy="21">bán hàng</tspan></text>
  <g transform="translate(95 675)" class="actor"><circle cx="50" cy="25" r="23"/><path d="M50 48 V112 M12 74 H88 M50 112 L16 157 M50 112 L84 157"/></g><text x="145" y="865" class="name"><tspan x="145">Quản trị viên /</tspan><tspan x="145" dy="21">Chủ điểm bán</tspan></text>
  <ellipse cx="800" cy="230" rx="220" ry="50" class="uc main"/><text x="800" y="236" class="uct bold">UC03 — Tra cứu đơn hàng</text>
  <ellipse cx="505" cy="397" rx="175" ry="43" class="uc"/><text x="505" y="392" class="uct"><tspan x="505" class="bold">Hiển thị danh sách đơn hàng</tspan><tspan x="505" dy="18" font-size="12">Mới nhất trước, tối đa 500 đơn</tspan></text>
  <ellipse cx="505" cy="552" rx="175" ry="43" class="uc"/><text x="505" y="558" class="uct bold">Tìm kiếm theo mã đơn</text>
  <ellipse cx="505" cy="707" rx="175" ry="43" class="uc"/><text x="505" y="702" class="uct"><tspan x="505" class="bold">Lọc theo trạng thái và kênh bán</tspan><tspan x="505" dy="18" font-size="12">Hoàn thành, chờ, hủy, hoàn tiền</tspan></text>
  <ellipse cx="1110" cy="397" rx="190" ry="43" class="uc"/><text x="1110" y="392" class="uct"><tspan x="1110" class="bold">Xem chi tiết giao dịch</tspan><tspan x="1110" dy="18" font-size="12">Thanh toán, khách hàng và mặt hàng</tspan></text>
  <ellipse cx="1110" cy="552" rx="190" ry="43" class="uc"/><text x="1110" y="547" class="uct"><tspan x="1110" class="bold">Xuất danh sách CSV</tspan><tspan x="1110" dy="18" font-size="12">Theo kết quả đang tìm và lọc</tspan></text>
  <ellipse cx="1110" cy="707" rx="190" ry="43" class="uc dash"/><text x="1110" y="702" class="uct"><tspan x="1110" class="bold">UC11 — Hoàn đơn hàng</tspan><tspan x="1110" dy="18" font-size="12">Chỉ quản trị viên, đơn đủ điều kiện</tspan></text>
  <ellipse cx="610" cy="840" rx="180" ry="35" class="uc dash"/><text x="610" y="846" class="uct bold">Thông báo không có đơn phù hợp</text>
